version: '3.8'

services:
  postgres:
    image: postgres:15
    container_name: hat_postgres
    environment:
      POSTGRES_DB: hat_development
      POSTGRES_USER: hat_user
      POSTGRES_PASSWORD: hat_password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hat_user -d hat_development"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Test database (separate from development)
  postgres_test:
    image: postgres:15
    container_name: hat_postgres_test
    environment:
      POSTGRES_DB: hat_test
      POSTGRES_USER: hat_user
      POSTGRES_PASSWORD: hat_password
    ports:
      - "5433:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hat_user -d hat_test"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
  postgres_test_data: