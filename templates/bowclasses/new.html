{{ define "content" }}
<div class="container mx-auto px-4 py-8">
    <div class="max-w-2xl mx-auto">
        <div class="mb-8">
            <h1 class="text-3xl font-bold text-gray-800">{{.title}}</h1>
            <p class="text-gray-600 mt-2">Add a new bow class configuration</p>
        </div>

        <div class="bg-white rounded-lg shadow-md p-6">
            <form action="/bowclasses" method="POST">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <!-- Bow Class ID -->
                    <div class="md:col-span-1">
                        <label for="id" class="block text-sm font-medium text-gray-700 mb-2">
                            Bow Class ID *
                        </label>
                        <input type="text" id="id" name="id" required
                               placeholder="e.g., AMLB"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                        <p class="text-xs text-gray-500 mt-1">Unique identifier (e.g., AMLB for Adult Male Longbow)</p>
                    </div>

                    <!-- Name -->
                    <div class="md:col-span-1">
                        <label for="name" class="block text-sm font-medium text-gray-700 mb-2">
                            Name *
                        </label>
                        <input type="text" id="name" name="name" required
                               placeholder="e.g., Adult Male Longbow"
                               class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                    </div>

                    <!-- Age Group -->
                    <div class="md:col-span-1">
                        <label for="age_group" class="block text-sm font-medium text-gray-700 mb-2">
                            Age Group *
                        </label>
                        <select id="age_group" name="age_group" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select Age Group</option>
                            <option value="cub">Cub</option>
                            <option value="junior">Junior</option>
                            <option value="young-adult">Young Adult</option>
                            <option value="adult">Adult</option>
                            <option value="veteran">Veteran</option>
                            <option value="senior">Senior</option>
                        </select>
                    </div>

                    <!-- Gender -->
                    <div class="md:col-span-1">
                        <label for="gender" class="block text-sm font-medium text-gray-700 mb-2">
                            Gender *
                        </label>
                        <select id="gender" name="gender" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select Gender</option>
                            <option value="male">Male</option>
                            <option value="female">Female</option>
                        </select>
                    </div>

                    <!-- Bow Type -->
                    <div class="md:col-span-2">
                        <label for="bow_type" class="block text-sm font-medium text-gray-700 mb-2">
                            Bow Type *
                        </label>
                        <select id="bow_type" name="bow_type" required
                                class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <option value="">Select Bow Type</option>
                            <option value="longbow">Longbow</option>
                            <option value="recurve">Traditional Recurve</option>
                            <option value="barebow-recurve">Barebow Recurve</option>
                            <option value="bowhunter-recurve">Bowhunter Recurve</option>
                            <option value="freestyle-recurve">Freestyle Limited Recurve</option>
                            <option value="bowhunter-unlimited">Bowhunter Unlimited</option>
                            <option value="freestyle-unlimited">Freestyle Unlimited</option>
                            <option value="historical">Historical Bow</option>
                        </select>
                    </div>

                    <!-- Description -->
                    <div class="md:col-span-2">
                        <label for="description" class="block text-sm font-medium text-gray-700 mb-2">
                            Description
                        </label>
                        <textarea id="description" name="description" rows="3"
                                  placeholder="Optional description of the bow class rules and characteristics"
                                  class="w-full px-3 py-2 border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
                    </div>
                </div>

                <!-- Form Actions -->
                <div class="flex justify-end space-x-4 mt-8">
                    <a href="/bowclasses" 
                       class="px-4 py-2 border border-gray-300 rounded-md text-gray-700 hover:bg-gray-50">
                        Cancel
                    </a>
                    <button type="submit" 
                            class="px-4 py-2 bg-blue-500 text-white rounded-md hover:bg-blue-600">
                        Create Bow Class
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
{{ end }}
